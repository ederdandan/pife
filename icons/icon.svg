<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="wood" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#9a5a2c"/>
      <stop offset="0.6" stop-color="#6b3a18"/>
      <stop offset="1" stop-color="#3f200b"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f1e7cf"/>
    </linearGradient>
    <path id="heart" d="M0 34 C-30 12 -45 -4 -45 -19 C-45 -33 -34 -43 -21 -43 C-11 -43 -4 -37 0 -30 C4 -37 11 -43 21 -43 C34 -43 45 -33 45 -19 C45 -4 30 12 0 34 Z"/>
    <path id="diamond" d="M0 -44 L34 0 L0 44 L-34 0 Z"/>
    <path id="spade" d="M0 -46 C30 -20 46 -4 46 12 C46 26 36 34 24 34 C15 34 8 29 4 23 C5 32 9 40 17 47 L-17 47 C-9 40 -5 32 -4 23 C-8 29 -15 34 -24 34 C-36 34 -46 26 -46 12 C-46 -4 -30 -20 0 -46 Z"/>
    <g id="card">
      <rect x="-92" y="-128" width="184" height="256" rx="22" fill="url(#paper)" stroke="#1e3a8a" stroke-width="7"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#wood)"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#f8fafc" stroke-width="6" stroke-dasharray="20 10" opacity="0.55"/>

  <!-- Leque de três cartas: uma trinca, a alma do Pife -->
  <g transform="translate(256 278)">
    <g transform="rotate(-24 0 190)">
      <use href="#card"/>
      <use href="#heart" fill="#dc2626" transform="translate(-28 -62) scale(0.95)"/>
    </g>
    <g transform="rotate(24 0 190)">
      <use href="#card"/>
      <use href="#diamond" fill="#dc2626" transform="translate(28 -62) scale(0.95)"/>
    </g>
    <g>
      <use href="#card"/>
      <use href="#spade" fill="#1e293b" transform="translate(0 -6) scale(1.45)"/>
    </g>
  </g>
</svg>
